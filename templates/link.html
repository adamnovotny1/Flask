{% extends 'base.html' %}
{% block content %}
<h2>
    {% block title %}
    Formular
    {% endblock %}
</h2>
<form method="post">

    <label>Uživatelské jméno:
        <input type="text" name="username" placeholder="Zadejte uživatelské jméno">
    </label>

    <label>Heslo:
        <input type="text" name="password">
    </label>

    <label>Flask:
        <input type="radio" name="radio" value="Flask" checked>
    </label>

    <label>PHP:
        <input type="radio" name="radio" value="PHP">
    </label>

    <label>Javascript:
        <input type="radio" name="radio" value="JavaScript">
    </label>

    <input type="submit" value="Odeslat">

</form>
{% endblock %}
